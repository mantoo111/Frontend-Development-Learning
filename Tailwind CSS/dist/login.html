<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="./output.css" />
</head>
<body class="flex place-items-center justify-center h-screen">
    <div class="max-w-2xl bg-black place-items-center p-5 rounded-2xl">
       <div class="max-w-80 grid gap-5">
        <h2 class=" text-5xl font-bold text-white">Login</h2>
        <form class="space-y-6 text-white">
            <div>
                <input class="text-gray-600 w-80 bg-white py-2 px-3 rounded-2xl focus:outline-none  focus:ring-1 focus:ring-black focus:drop-shadow-lg" type="email" placeholder="Email Address">
              
                
            </div>
            <div>
                <input class="text-gray-600 w-80 bg-white py-2 px-3 rounded-2xl focus:outline-none  focus:ring-1  " type="password" placeholder="Enter password">
                
            </div>
            <button class="text-white bg-blue-400 rounded-full w-80 font-semibold py-2 px-3">Sign-in</button>
        </form>
        <div class="text-white border-t border-white pt-4 space-y-4">
            <p >Don't have an account? <a class="text-blue-500 font-semibold cursor-pointer">Sign-Up</a></p>
            <p >Forgot password? <a class="text-blue-500 font-semibold cursor-pointer">Reset password</a></p>
            <p >Don't have a password yet? <a class="text-blue-500 font-semibold cursor-pointer">Set password</a></p>
        </div>
    </div>
</div>
</body>
</html>
